services:
  - type: web
    name: bookies-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        value: 986736228685-nsu7ll0pnrmo4tmjb7re41dnl28ql5jv.apps.googleusercontent.com
      - key: OCEANOFPDF_BASE_URL
        value: https://oceanofpdf.com
