services:
  - type: web
    name: bookies-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookies-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OCEANOFPDF_BASE_URL
        value: https://oceanofpdf.com

databases:
  - name: bookies-postgres
    databaseName: bookies_postgres_tinr
    user: bookies_postgres_tinr_user
    plan: free
    region: oregon
